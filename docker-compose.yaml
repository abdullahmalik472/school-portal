services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: school
      MYSQL_USER: schooluser
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-app/backend/schema.cloud.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-mysql:
    build: ./mysql-app/backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: schooluser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: school
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET_MYSQL}
      ADMIN_CODES: ${ADMIN_CODES}
      CRON_SECRET: ${CRON_SECRET}
      ENABLE_NODE_CRON: "false"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend-mysql
    environment:
      MYSQL_API_URL: http://backend-mysql:5000
      SUPABASE_API_URL: http://host.docker.internal:4001
      COOKIE_SECURE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

volumes:
  mysql_data: